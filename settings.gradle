pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'emergency-matching-backend'

include 'api-gateway'
include 'auth-service'
include 'hospital-service'
include 'emergency-service'
include 'notification-service'
