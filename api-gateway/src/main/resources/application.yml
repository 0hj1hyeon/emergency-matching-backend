server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # 로그인, 회원가입은 필터 없이 통과
        - id: auth-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/signup, /api/auth/login
        
        # Hospital Service 
        - id: hospital-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/hospitals/**
          filters:
            - JwtAuthenticationFilter

        # Emergency Service 
        - id: emergency-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/emergencies/**
          filters:
            - JwtAuthenticationFilter

        # Notification Service 
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/ws/**
          filters:
            - JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForEmergencyMatchingSystemVeryLongKey1234567890!@#}

management:
  endpoints:
    web:
      exposure:
        include: health,info
