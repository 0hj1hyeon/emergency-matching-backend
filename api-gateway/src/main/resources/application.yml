server:
  port: 8080

spring:
  application:
    name: api-gateway

jwt:
  secret: "defaultSecretKeyForEmergencyMatchingSystemVeryLongKey1234567890!@#"

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # 로그인, 회원가입은 필터 없이 통과
        - id: auth-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/signup, /api/auth/login
        
        # (예시) 나중에 추가될 다른 서비스들은 JWT 필터를 거쳐야 함
        # - id: emergency-service
        #   uri: http://localhost:8082
        #   predicates:
        #     - Path=/api/emergency/**
        #   filters:
        #     - JwtAuthenticationFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info
