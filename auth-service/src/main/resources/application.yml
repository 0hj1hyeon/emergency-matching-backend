server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ems_db
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  # 환경 변수 JWT_SECRET 값을 우선적으로 사용하며, 없으면 로컬 개발용 기본값을 사용합니다.
  secret: ${JWT_SECRET:defaultSecretKeyForEmergencyMatchingSystemVeryLongKey1234567890!@#}
  expiration-time: 3600000 # 1시간 (밀리초 단위)

management:
  endpoints:
    web:
      exposure:
        include: health,info
